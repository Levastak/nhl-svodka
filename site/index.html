<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Итоги ночи НХЛ, таблица, лидеры и прогнозы модели на каждый матч — по-русски, обновляется дважды в день.">
<meta property="og:title" content="Сводка НХЛ">
<meta property="og:description" content="Итоги ночи, три звезды, прогнозы модели и честный журнал точности.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#07080A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23D0021B'/%3E%3Ctext x='16' y='21' font-size='13' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3ENHL%3C/text%3E%3C/svg%3E">
<title>Сводка НХЛ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap">
<style>
/* Layout: спортивная редакция — тёмная шапка с лентой счетов, светлая газетная полоса; слева статьи, справа колонка виджетов; узкие жирные заголовки, плотные таблицы */
:root{
  --bg:#EDEEF0;         /* полоса */
  --card:#FFFFFF;       /* модуль */
  --ink:#111317;        /* основной текст */
  --ink2:#3F434A;       /* второстепенный */
  --mute:#6B7079;       /* подписи */
  --line:#DCDEE2;
  --soft:#F3F4F6;
  --soft2:#E3E5E9;
  --bar:#121418;        /* шапка */
  --strip:#1C1F25;      /* лента счетов */
  --barink:#F2F4F7;
  --barmute:#9BA1AB;
  --acc:#D0021B;        /* редакционный красный */
  --link:#1F5BD6;
  --win:#16884A; --loss:#C8102E; --ot:#B26B00;
  --gold:#A87400; --goldbg:#FFF3D6;
  --valbg:#E3F5EA;
  --s1:#5B8CFF; --s2:#E8602E;  /* серии графика: Claude / Лев */
  --display:"Fira Sans Extra Condensed","Fira Sans",Arial Narrow,sans-serif;
  --body:"Fira Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1013;--card:#171A1F;--ink:#ECEEF2;--ink2:#C2C7CF;--mute:#8C929C;--line:#2A2E35;--soft:#1F2329;--soft2:#2A2F37;
  --bar:#07080A;--strip:#121418;--acc:#FF3B4A;--link:#7FA7FF;--win:#3DCB80;--loss:#FF6B74;--ot:#E8AE4A;--gold:#E9C46A;--goldbg:#2C2512;--valbg:#14301F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1013;--card:#171A1F;--ink:#ECEEF2;--ink2:#C2C7CF;--mute:#8C929C;--line:#2A2E35;--soft:#1F2329;--soft2:#2A2F37;
  --bar:#07080A;--strip:#121418;--acc:#FF3B4A;--link:#7FA7FF;--win:#3DCB80;--loss:#FF6B74;--ot:#E8AE4A;--gold:#E9C46A;--goldbg:#2C2512;--valbg:#14301F;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--link)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}

/* шапка */
.top{background:var(--bar);color:var(--barink);padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:40}
.top .wrap{display:flex;align-items:center;gap:20px;height:54px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--barink);flex:none}
.mark i{width:26px;height:26px;border-radius:50%;background:#000;border:2px solid #fff;position:relative;flex:none}
.mark i::after{content:"";position:absolute;inset:-2px auto -2px 50%;width:3px;margin-left:-1.5px;background:var(--acc)}
.mark b{font-family:var(--display);font-weight:800;font-style:italic;font-size:23px;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.mark b span{color:var(--acc)}
.upd{margin-left:auto;font-size:11.5px;color:var(--barmute);text-align:right;line-height:1.3}
.tnav{display:none}
@media (min-width:900px){
  .tnav{display:flex;height:100%;gap:2px}
  .tnav button{background:none;border:0;color:var(--barink);font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em;padding:0 12px;height:100%;border-bottom:3px solid transparent;border-top:3px solid transparent;opacity:.82}
  .tnav button:hover{opacity:1}
  .tnav button[aria-current="page"]{opacity:1;border-bottom-color:var(--acc)}
}

/* лента счетов */
.strip{background:var(--strip);color:var(--barink);border-bottom:1px solid #000}
.strip .wrap{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding-inline:0}
.sg{flex:none;width:150px;padding:8px 12px;border:0;border-right:1px solid rgba(255,255,255,.08);background:none;color:var(--barink);text-align:left;display:flex;flex-direction:column;gap:3px}
.sg:hover{background:rgba(255,255,255,.05)}
.sg small{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--barmute)}
.sg small.live{color:#FF5A66}
.sg .r{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600}
.sg .r b{margin-left:auto;font-weight:700}
.sg .r.lose{color:var(--barmute);font-weight:500}
.sg .r.lose b{font-weight:500}
.sg .dayl{display:flex;align-items:center}
.sgl{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--barmute);border-right:1px solid rgba(255,255,255,.08);line-height:1.1}
.sgl b{font-size:22px;color:var(--barink);letter-spacing:0}
.bdg.m{--sz:44px}
.wsub{font-family:var(--display);font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:10px 14px 2px;border-top:1px solid var(--line)}
.wg .wsub:first-of-type{border-top:0}
.wsub.hero{color:var(--gold)}.wsub.bad{color:var(--loss)}
.perf.hx{border-top:0;padding-top:6px}
.perf .tm2{font-size:12px;color:var(--mute)}
.perf p{-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.hrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.hrow.two{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.hc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden;min-width:0}
.hc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--a)}
.hc-top{display:flex;align-items:center;gap:10px;min-width:0}
.hc .rk{font-family:var(--display);font-weight:800;font-size:28px;color:var(--soft2);line-height:1;width:18px}
.hc.bad .rk{font-size:22px}
.hc-n{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.hc-n .plink{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.hc-n small{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-v{font-family:var(--display);font-weight:800;font-size:30px;white-space:nowrap;margin-left:auto}
.hc.bad .hc-v{font-size:18px}
.hc p{margin:0;font-size:14px;line-height:1.5;color:var(--ink2)}
.hc.bad{background:var(--soft)}
@media (max-width:760px){.hrow,.hrow.two{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:0 16px}.hrow>.hc{flex:0 0 82%;scroll-snap-align:start}}
.spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.spec div{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.spec small{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.06em}
.spec b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.05}
.spec span{font-size:12.5px;color:var(--ink2)}
.wg .seg button{padding:10px 9px;font-size:15px}

/* док (телефон) */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{display:grid;grid-template-columns:repeat(7,1fr);padding-block:2px}
.dock button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10px;min-width:0;font-weight:600;color:var(--mute);border-top:2px solid transparent}
.dock svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dock button[aria-current="page"]{color:var(--ink);border-top-color:var(--acc)}
main{padding-block:16px 96px}
@media (min-width:900px){.dock{display:none}main{padding-block:22px 56px}}

/* общие элементы */
.view{display:flex;flex-direction:column;gap:20px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.01em;text-transform:uppercase}
.sec-h span{color:var(--mute);font-size:13px}
.eyebrow{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.card{position:relative;background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
.pad{padding:16px}
.muted{color:var(--mute)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.seg{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;border:0;background:none;padding:10px 14px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.02em;color:var(--mute);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:3px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--ink2);white-space:nowrap;letter-spacing:.02em}
.chip.val{background:var(--valbg);color:var(--win)}
.chip.live{background:var(--acc);color:#fff}
.chip.gold{background:var(--goldbg);color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:4px;padding:8px 13px;font-weight:600;font-size:13.5px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--link);padding-inline:4px}
.btn.ghost:hover{text-decoration:underline;text-underline-offset:3px}
.btn svg{width:15px;height:15px;fill:currentColor}

/* эмблема команды */
.bdg{--sz:30px;width:var(--sz);height:var(--sz);flex:none;display:inline-block;vertical-align:middle}
.bdg svg{width:100%;height:100%;display:block}
.bdg.l{--sz:52px}.bdg.xl{--sz:76px}.bdg.s{--sz:22px}.bdg.xs{--sz:18px}
.tm{display:flex;align-items:center;gap:10px;min-width:0}
.tm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlink{background:none;border:0;padding:0;text-align:left;cursor:pointer}
.tlink:hover b{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}

/* форма */
.fd{display:inline-flex;gap:2px;vertical-align:middle}
.fd i{width:16px;height:16px;border-radius:2px;display:grid;place-items:center;font-style:normal;font-size:9.5px;font-weight:700;color:#fff}
.fd i.W{background:var(--win)}.fd i.L{background:var(--loss)}.fd i.O{background:var(--ot)}

/* главная: статьи + колонка */
.home{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.home .col{display:flex;flex-direction:column;gap:20px;min-width:0}
.mwrap{display:flex;flex-direction:column;gap:20px}
.only-d{display:none}
@media (min-width:980px){.home{grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}.only-d{display:flex}.only-m{display:none}}

/* арт статьи вместо фото */
.art{position:relative;overflow:hidden;background:var(--a,#223);aspect-ratio:16/8;max-width:100%;isolation:isolate;container-type:inline-size}
@media (min-width:980px){.lead .art{aspect-ratio:16/7}}
.art::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,var(--a) 0 49.6%,var(--b) 50.4% 100%);z-index:-2}
.art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 14px),linear-gradient(180deg,transparent 40%,rgba(0,0,0,.45));z-index:-1}
.art .em{position:absolute;top:50%;width:46%;max-width:300px;aspect-ratio:1;transform:translateY(-50%);filter:drop-shadow(0 12px 30px rgba(0,0,0,.4))}
.art .em svg{width:100%;height:100%;display:block}
.art .em.a{left:4%}.art .em.b{right:4%}
.art .em.solo{left:50%;transform:translate(-50%,-50%);width:52%}
.art .ghost{position:absolute;right:-6%;bottom:-18%;width:70%;aspect-ratio:1;opacity:.12;filter:grayscale(1) brightness(3)}
.art .ghost svg{width:100%;height:100%}
.art .sc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:clamp(26px,15cqw,96px);color:#fff;letter-spacing:.02em;text-shadow:0 4px 18px rgba(0,0,0,.45);white-space:nowrap}
.art .tagl{position:absolute;left:12px;bottom:10px;font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--acc);padding:2px 8px}
.anim .art .em.a{animation:fromL .7s cubic-bezier(.2,.8,.2,1) both}
.anim .art .em.b{animation:fromR .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fromL{from{transform:translate(-30%,-50%);opacity:0}}
@keyframes fromR{from{transform:translate(30%,-50%);opacity:0}}

.lead{overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;width:100%}
.lead .tx{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.lead h1{font-family:var(--display);font-weight:700;font-size:clamp(27px,4.4vw,40px);line-height:1.05;letter-spacing:-.005em}
.lead p{margin:0;font-size:16px;color:var(--ink2);max-width:68ch;line-height:1.55}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.meta .tn{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink2)}
.lead:hover h1,.nrow:hover h3,.tile:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.tile{padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.tile .art{aspect-ratio:16/9}
.tile .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.tile h3{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.12}
.tile p{margin:0;font-size:13.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.nlist{display:flex;flex-direction:column}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:14px;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.nrow:first-child{border-top:0}
.nrow .art{aspect-ratio:4/3;border-radius:3px}
.nrow .art .em.solo{width:62%}
.nrow h3{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.15}
.nrow p{margin:4px 0 6px;font-size:13.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* виджеты колонки */
.wg{display:flex;flex-direction:column}
.wg-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.wg-h h2{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.03em;text-transform:uppercase}
.wg-h .btn.ghost{font-size:12.5px;padding:0}
.wg-f{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:center}
.wrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:13.5px;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.wrow:first-of-type{border-top:0}
.wrow .nm{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.wrow .nm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .nm small{color:var(--mute);font-size:12px}
.wrow .v{font-family:var(--display);font-weight:700;font-size:18px;text-align:right}
.wrow .rk{font-weight:700;color:var(--mute);font-size:12px;width:16px;text-align:right}
.wtab{width:100%;border-collapse:collapse;font-size:13px}
.wtab th{font-size:10.5px;font-weight:700;color:var(--mute);letter-spacing:.06em;text-align:right;padding:6px 8px;text-transform:uppercase}
.wtab td{padding:6px 8px;text-align:right;border-top:1px solid var(--line)}
.wtab th:nth-child(2),.wtab td:nth-child(2){text-align:left}
.wtab td:first-child{color:var(--mute);width:22px;font-weight:600}
.wtab td.p{font-weight:700}
.wtab .tm{gap:8px}
.wtab tr.cut td{border-top:2px solid var(--acc)}
.wtab tr.fav td{background:var(--goldbg)}
.today{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font-size:13.5px}
.today:first-of-type{border-top:0}
.today .t{font-family:var(--display);font-weight:700;font-size:16px}
.today .tt{display:flex;flex-direction:column;gap:3px;min-width:0}
.today .tt span{display:flex;align-items:center;gap:7px;font-weight:600}
.today .pp{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-weight:700;font-size:12.5px}
.today .pp .lo{color:var(--mute);font-weight:500}

/* превью матча дня */
.motd{position:relative;overflow:hidden;border-radius:var(--r);color:#fff;background:var(--bar);isolation:isolate}
.motd::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,var(--a) 0 42%,transparent 42.4% 57.6%,var(--h) 58% 100%);opacity:.92;z-index:-2}
.motd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(105deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px),linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55));z-index:-1}
.motd .in{display:flex;flex-direction:column;gap:14px;padding:16px 18px 18px}
.motd .eyebrow{color:#fff;background:var(--acc);align-self:flex-start;padding:2px 8px;font-size:12.5px}
.motd .sec-h .eyebrow + .eyebrow,.motd .sec-h span.eyebrow:last-child{background:none;color:rgba(255,255,255,.8);padding:0}
.motd .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.motd .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0;color:#fff}
.motd .side b{font-family:var(--display);font-weight:700;font-size:clamp(19px,3.4vw,26px);line-height:1.05;text-transform:uppercase}
.motd .side small{color:rgba(255,255,255,.82);font-size:12px}
.motd .mid{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.motd .mid .time{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.motd .mid small{color:rgba(255,255,255,.8);font-size:12px}
.motd p{margin:0;color:rgba(255,255,255,.92);font-size:15px;max-width:66ch}
.motd .bar{background:rgba(255,255,255,.2)}
.motd .barlab{color:#fff}
.motd .odds-row .od{background:rgba(0,0,0,.35);color:#fff}
.motd .odds-row .od small{color:rgba(255,255,255,.75)}
.motd .od.pick{background:#fff;color:#111}
.motd .od.pick small{color:#555}
.motd .btn{background:#fff;color:#111;border-color:#fff}
.motd .fd i{box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.motd .rink,.motd .tint,.motd .aur{display:none}

/* вероятность */
.bar{display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--soft2);gap:2px}
.bar i{display:block;height:100%}
.barlab{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-top:6px}
.odds-row{display:flex;gap:6px;flex-wrap:wrap}
.od{display:flex;flex-direction:column;align-items:center;min-width:62px;padding:5px 10px;border-radius:3px;background:var(--soft);font-weight:700;font-size:15px}
.od small{font-size:10.5px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.od.pick{background:var(--ink);color:var(--card)}.od.pick small{color:var(--card);opacity:.75}

/* список матчей */
.gm{display:flex;flex-direction:column}
.gm-row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 16px;background:none;border:0;text-align:left;width:100%}
.gm-time{display:flex;flex-direction:column;gap:2px}
.gm-time b{font-family:var(--display);font-weight:700;font-size:19px}
.gm-time small{font-size:11px;color:var(--mute);font-weight:600}
.gm-teams{display:flex;flex-direction:column;gap:7px;min-width:0}
.gm-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.gm-side .mine{font-size:12px;font-weight:700;color:var(--link);text-align:right}
.gm-x{border-top:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:18px}
.chev{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;transition:transform .2s}
.open .chev{transform:rotate(180deg)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px}
.kv div{background:var(--soft);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kv small{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.04em}
.kv b{font-size:16px}
.mtab{width:100%;border-collapse:collapse;font-size:13.5px}
.mtab th{font-size:11px;font-weight:700;color:var(--mute);text-align:right;padding:6px 8px;letter-spacing:.04em;text-transform:uppercase}
.mtab th:first-child,.mtab td:first-child{text-align:left}
.mtab td{padding:8px;border-top:1px solid var(--line);text-align:right;font-weight:600}
.pos{color:var(--win)}.neg{color:var(--loss)}
.why{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.why li{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:14px}
.why li::before{content:"";width:6px;height:6px;background:var(--acc);margin:8px 0 0 4px}
.pickbox{border-radius:4px;background:var(--soft);border-left:3px solid var(--ink);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pickbox .h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pickbox b{font-size:15.5px}
.pickbox p{margin:0;font-size:14px;color:var(--ink2)}
.h3{font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.inj{display:flex;flex-wrap:wrap;gap:6px}

/* экспресс */
.exp{display:flex;flex-direction:column;gap:0}
.exp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.exp-h b{font-family:var(--display);font-size:26px;font-weight:800}
.legs{display:flex;flex-direction:column}
.leg{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.leg div{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.leg div b{font-weight:600}
.leg small{color:var(--mute);font-size:12px}
.leg > b{font-family:var(--display);font-size:18px;font-weight:700}

/* герои ночи */
.perf{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.perf:first-of-type{border-top:0}
.perf .nm{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.perf .nm small{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.perf .nm small.hero{color:var(--gold)}.perf .nm small.bad{color:var(--loss)}
.perf .v{font-family:var(--display);font-weight:800;font-size:22px;text-align:right;line-height:1.05;max-width:9.5em}
.perf .v.long{font-size:15px;font-weight:700}
.perf p{grid-column:2/-1;margin:0;font-size:13px;color:var(--ink2)}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.aw{display:flex;flex-direction:column;gap:10px;padding:16px}
.aw .who{display:flex;align-items:center;gap:12px}
.aw .who div{display:flex;flex-direction:column;min-width:0}
.aw .big{margin-left:auto;font-family:var(--display);font-weight:800;font-size:24px}
.aw p{margin:0;font-size:14px;color:var(--ink2)}
.losers{display:flex;flex-direction:column;gap:10px}
.losers div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;font-size:13.5px}

/* результаты */
.dates{display:flex;align-items:center;gap:8px}
.dates .arrow{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;width:40px;height:44px;display:grid;place-items:center;flex:none}
.dates .arrow:disabled{opacity:.35;cursor:default}
.dates .arrow svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.2}
.dchips{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;flex:1;background:var(--card);border:1px solid var(--line);border-radius:4px}
.dchips button{flex:none;border:0;border-right:1px solid var(--line);background:none;padding:5px 10px;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute);font-weight:600;min-width:56px;text-transform:uppercase}
.dchips button b{font-size:15px;color:var(--ink);font-family:var(--display)}
.dchips button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--acc);color:var(--ink)}
.res{overflow:hidden}
.poster{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:18px 14px 14px;border-bottom:1px solid var(--line)}
.poster::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--a) 0 3px,transparent 3px calc(100% - 3px),var(--h) calc(100% - 3px))}
.poster .side{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.poster .side b{font-weight:600;font-size:14px;line-height:1.2}
.poster .side small{font-size:11.5px;color:var(--mute)}
.poster .side.lose{opacity:.6}
.score{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.score b{font-family:var(--display);font-weight:800;font-size:42px;letter-spacing:.02em;line-height:1}
.score small{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.res-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.goals{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.goals .per{font-family:var(--display);font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-top:8px;border-bottom:1px solid var(--line);padding-bottom:3px}
.goal{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:4px 0}
.goal time{color:var(--mute);font-weight:600;font-size:12.5px;padding-top:1px}
.goal.h{text-align:right;grid-template-columns:1fr 44px}
.goal.h time{order:2;text-align:right}
.goal em{font-style:normal;font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:2px;background:var(--soft2);color:var(--ink2);margin:0 4px}
.goal .as{color:var(--mute);font-size:12.5px}
.sbars{display:flex;flex-direction:column;gap:9px}
.sbar{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.sbar span:last-child{text-align:right}
.sbar .mid{display:flex;flex-direction:column;gap:4px;align-items:center}
.sbar .mid small{font-size:11px;color:var(--mute);font-weight:600}
.sbar .two{display:flex;width:100%;gap:2px;height:6px}
.sbar .two i{display:block;height:100%;border-radius:1px}
.stars{display:flex;gap:6px;flex-wrap:wrap}
.recap{margin:0;font-size:14.5px;color:var(--ink2);max-width:68ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* таблицы */
.tbl-wrap{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.06em;text-align:right;padding:8px;white-space:nowrap;text-transform:uppercase;border-bottom:1px solid var(--line)}
table.st td{padding:8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
table.st tbody tr:nth-child(even) td{background:var(--soft)}
table.st th.l,table.st td.l{text-align:left}
table.st td.n{color:var(--mute);font-weight:600;width:28px}
table.st td.p{font-weight:700}
table.st tr.cut td{border-top:2px solid var(--acc)}
table.st tr.fav td{background:var(--goldbg)!important}
.thead{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 8px;gap:8px}
.thead h3{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.legend{font-size:12.5px;color:var(--mute);margin:0;max-width:72ch}

/* журнал */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.sum div{padding:14px;display:flex;flex-direction:column;gap:2px}
.sum b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.sum small{font-size:12px;color:var(--mute);font-weight:600}
.jr{display:flex;flex-direction:column}
.jrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.jrow:first-child{border-top:0}
.jrow .l{display:flex;flex-direction:column;gap:3px;min-width:0}
.jrow .l b{font-size:14.5px;font-weight:600}
.jrow .l small{font-size:12.5px;color:var(--mute)}
.jrow .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-weight:700}
.tag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:2px;letter-spacing:.05em;text-transform:uppercase;background:var(--soft2);color:var(--ink2)}
.tag.total{color:var(--link)}.tag.express{color:var(--acc)}.tag.other{color:var(--gold)}
.st-hit{color:var(--win)}.st-miss{color:var(--loss)}.st-void{color:var(--ot)}.st-wait{color:var(--mute);font-weight:600}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--bar);color:#fff;border-radius:4px;padding:8px 10px;font-size:12.5px;line-height:1.35;transform:translate(-50%,-110%);white-space:nowrap}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:600}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:14px;height:3px;display:inline-block}

/* форма ставки */
form.bet{display:flex;flex-direction:column;gap:12px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink2)}
label.f input,label.f select{font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);width:100%}
.note{font-size:12.5px;color:var(--mute);margin:0}
.legsel{display:flex;flex-direction:column;gap:6px}
.legsel div{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border-radius:4px;padding:8px 10px;font-size:13.5px;font-weight:600}
.legsel button{border:0;background:none;color:var(--loss);font-weight:700}
.mini{display:flex;gap:4px;flex-wrap:wrap}
.mini button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:3px;padding:4px 8px;font-size:11.5px;font-weight:600}
.mini button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* ещё */
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.menu button{display:flex;align-items:center;gap:14px;padding:16px;text-align:left;color:var(--ink)}
.menu button svg{width:24px;height:24px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu button div{display:flex;flex-direction:column}
.menu button b{font-family:var(--display);font-size:19px;font-weight:700}
.menu button small{color:var(--mute);font-size:12.5px}
.news{display:flex;flex-direction:column;gap:8px;padding:16px}
.news h3{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.15}
.news p{margin:0;font-size:14.5px;color:var(--ink2);max-width:70ch}
.news .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.news .tn{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink2)}
.list{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.lrow:first-child{border-top:0}
.lrow .n{color:var(--mute);font-weight:600;font-size:12.5px}
.lrow .v{font-weight:700}
.plink{background:none;border:0;padding:0;font-weight:600;text-align:left;cursor:pointer;color:inherit}
.plink:hover{text-decoration:underline;text-underline-offset:3px;color:var(--link)}
.pw{display:grid;grid-template-columns:24px minmax(0,1fr) 70px;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.pw:first-child{border-top:0}
.pw .bars{display:flex;flex-direction:column;gap:3px}
.pw .bars i{display:block;height:5px;border-radius:1px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.teams button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);text-align:left;font-weight:600;font-size:14px}

/* лист команды/игрока/статьи */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sheet .panel{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:10px 10px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:900px){.sheet{align-items:center}.sheet .panel{border-radius:8px;max-height:88%}}
.sh-head{position:relative;color:#fff;background:var(--bar);padding:18px 16px;display:flex;align-items:center;gap:14px;overflow:hidden;isolation:isolate}
.sh-head::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,var(--a) 0 60%,transparent 60.4%);opacity:.9;z-index:-1}
.sh-head div{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.sh-head h2{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1.05}
.sh-head small{color:rgba(255,255,255,.85)}
.sh-x{border:0;background:rgba(0,0,0,.35);color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;flex:none}
.star{border:0;background:rgba(0,0,0,.35);color:#fff;border-radius:3px;padding:7px 12px;font-weight:600;font-size:13px;flex:none}
.star[aria-pressed="true"]{background:#fff;color:#111}
.sh-body{padding:16px;display:flex;flex-direction:column;gap:18px}
.lines{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.lines div{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lines span.k{font-size:11px;color:var(--mute);font-weight:700;width:34px}
.lines .p{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:3px 8px}
.empty{padding:22px 16px;text-align:center;color:var(--mute);font-size:14px}

/* читалка */
.reader{background:var(--card)}
.reader .art{aspect-ratio:16/8}
.reader .rx{position:absolute;right:12px;top:12px;z-index:2}
.reader .body{padding:18px 20px 26px;display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto}
.reader h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.06}
.reader .dek{font-size:18px;line-height:1.5;color:var(--ink2);margin:0}
.reader .txt p{margin:0 0 14px;font-size:16.5px;line-height:1.7}
.reader .rel{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:2px}

/* движение */
@keyframes lamp{0%,100%{box-shadow:0 0 0 0 rgba(208,2,27,.55)}50%{box-shadow:0 0 0 6px rgba(208,2,27,0)}}
.chip.live{animation:lamp 1.6s ease-in-out infinite}
@keyframes rise{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.anim .view>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.anim .bar i{animation:grow .9s cubic-bezier(.2,.8,.2,1) .2s both}
.bar i:first-child{transform-origin:right center}.bar i:last-child{transform-origin:left center}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.chart polyline{stroke-dasharray:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) both}
@keyframes sheetin{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{background:rgba(0,0,0,0)}}
.sheet{animation:fade .2s ease both}.sheet .panel{animation:sheetin .35s cubic-bezier(.2,1,.35,1) both}
.lead .art .em,.tile .art .em,.nrow .art .em{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){.lead:hover .em.a,.tile:hover .em.a{transform:translate(-4%,-50%) rotate(-6deg)}.lead:hover .em.b,.tile:hover .em.b{transform:translate(4%,-50%) rotate(6deg)}.nrow:hover .em.solo,.tile:hover .em.solo,.lead:hover .em.solo{transform:translate(-50%,-50%) scale(1.06) rotate(-4deg)}
  .res,.tile,.lead,.menu button,.teams button{transition:box-shadow .18s ease}.res:hover,.tile:hover,.lead:hover,.menu button:hover,.teams button:hover{box-shadow:0 6px 18px rgba(0,0,0,.12)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.motd .bdg.xl{--sz:58px}.motd .side b{font-size:18px}.hide-s{display:none}table.st td,table.st th{padding-inline:6px}.seg button{padding:9px 10px}.nrow{grid-template-columns:minmax(0,1fr) 92px;padding:12px 14px}.nrow h3{font-size:17.5px}}

/* ---------- вкладка «Модель» ---------- */
.mm-t{display:flex;align-items:center;gap:8px;min-width:0}
.mm-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm-t .pp{margin-left:auto;font-family:var(--display);font-weight:700;font-size:17px;padding-left:6px}
.essay{display:flex;flex-direction:column;gap:8px}
.essay p{margin:0;font-size:15px;line-height:1.55}
.mview{display:flex;flex-direction:column;gap:12px}
.mview .sum .card{box-shadow:none;background:var(--soft)}
.chip.no{background:none;border:1px dashed var(--line);color:var(--mute)}
.vbox.val{border-left-color:var(--win)}.vbox.gold{border-left-color:var(--gold)}.vbox.no{border-left-color:var(--line)}
button.leg{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:inherit;font:inherit;cursor:pointer}
button.leg:hover{background:var(--soft)}
details.card > summary::-webkit-details-marker{display:none}

<script>

"use strict";
/* ---------- справочники ---------- */

const FULL={ANA:"Anaheim Ducks",BOS:"Boston Bruins",BUF:"Buffalo Sabres",CGY:"Calgary Flames",CAR:"Carolina Hurricanes",CHI:"Chicago Blackhawks",COL:"Colorado Avalanche",CBJ:"Columbus Blue Jackets",DAL:"Dallas Stars",DET:"Detroit Red Wings",EDM:"Edmonton Oilers",FLA:"Florida Panthers",LAK:"Los Angeles Kings",MIN:"Minnesota Wild",MTL:"Montréal Canadiens",NSH:"Nashville Predators",NJD:"New Jersey Devils",NYI:"New York Islanders",NYR:"New York Rangers",OTT:"Ottawa Senators",PHI:"Philadelphia Flyers",PIT:"Pittsburgh Penguins",SJS:"San Jose Sharks",SEA:"Seattle Kraken",STL:"St. Louis Blues",TBL:"Tampa Bay Lightning",TOR:"Toronto Maple Leafs",UTA:"Utah Mammoth",VAN:"Vancouver Canucks",VGK:"Vegas Golden Knights",WSH:"Washington Capitals",WPG:"Winnipeg Jets"};
const COLORS={ANA:["#F47A38","#B9975B"],BOS:["#FFB81C","#000000"],BUF:["#003087","#FFB81C"],CGY:["#C8102E","#F1BE48"],CAR:["#CE1126","#000000"],CHI:["#CF0A2C","#000000"],COL:["#6F263D","#236192"],CBJ:["#002654","#CE1126"],DAL:["#006847","#8F8F8C"],DET:["#CE1126","#FFFFFF"],EDM:["#041E42","#FF4C00"],FLA:["#041E42","#C8102E"],LAK:["#111111","#A2AAAD"],MIN:["#154734","#A6192E"],MTL:["#AF1E2D","#192168"],NSH:["#FFB81C","#041E42"],NJD:["#CE1126","#000000"],NYI:["#00539B","#F47D30"],NYR:["#0038A8","#CE1126"],OTT:["#C52032","#C2912C"],PHI:["#F74902","#000000"],PIT:["#000000","#FCB514"],SJS:["#006D75","#EA7200"],SEA:["#001628","#99D9D9"],STL:["#002F87","#FCB514"],TBL:["#002868","#FFFFFF"],TOR:["#00205B","#FFFFFF"],UTA:["#6CACE4","#010101"],VAN:["#00205B","#00843D"],VGK:["#B4975A","#333F42"],WSH:["#C8102E","#041E42"],WPG:["#041E42","#004C97"]};
const DIVS=[["Восток","Атлантический","Atlantic",["BOS","BUF","DET","FLA","MTL","OTT","TBL","TOR"]],["Восток","Столичный","Metropolitan",["CAR","CBJ","NJD","NYI","NYR","PHI","PIT","WSH"]],["Запад","Центральный","Central",["CHI","COL","DAL","MIN","NSH","STL","UTA","WPG"]],["Запад","Тихоокеанский","Pacific",["ANA","CGY","EDM","LAK","SJS","SEA","VAN","VGK"]]];
const ALL=DIVS.flatMap(d=>d[3]);
const DIV_OF={},CONF_OF={};DIVS.forEach(d=>d[3].forEach(a=>{DIV_OF[a]=d[1];CONF_OF[a]=d[0]}));
const STAKE=1000;
const IC={
 home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
 games:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 res:'<svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>',
 table:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="4" cy="6" r=".5"/></svg>',
 picks:'<svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg>',
 more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>',
 news:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>',
 teams:'<svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.2"/><circle cx="17" cy="10" r="2.4"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M15 15.5c3 0 6 1.5 6 4.5"/></svg>',
 lead:'<svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
 inj:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M12 11v5M9.5 13.5h5"/></svg>',
 rus:'<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>',
 model:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>',
 power:'<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
 play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
 ext:'<svg viewBox="0 0 24 24"><path d="M14 4h6v6h-2V7.4l-7.3 7.3-1.4-1.4L16.6 6H14zM5 6h6v2H6v10h10v-5h2v7H4V6z"/></svg>'
};
const NAV=[["home","Главная"],["games","Матчи"],["model","Модель"],["results","Итоги"],["table","Таблица"],["picks","Прогнозы"],["more","Ещё"]];
const MORE=[["news","Новости","пересказ главного за сутки"],["teams","Команды","составы, звенья, календарь"],["power","Сила команд","рейтинг модели"],["lead","Лидеры","очки, голы, вратари"],["inj","Травмы","кто пропускает матчи"],["rus","Россияне","все наши в НХЛ"]];

/* ---------- утилиты ---------- */
let D=null,A={games:[]},M={games:[],teams:{}};
let VIEW="home",RES_DATE=null,TBL_MODE="div",PICK_MODE="claude",JF="all";
const OPEN=new Set();
let BETS=[],FAVS=[],DB=null,DB_OK=false,BET_LEGS=[];
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function lum(hex){const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;const f=v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);return .2126*f(r)+.7152*f(g)+.0722*f(b)}
/* ---------- эмблемы: клубная шайба с тремя буквами; шайба игрока с номером ---------- */
const EMF="'Fira Sans Extra Condensed','Arial Narrow',Arial,sans-serif";
function emColors(a){const c=COLORS[a]||["#556070","#8892A0"];const bg=c[0];const light=lum(bg)>.42;const fg=light?"#10131A":"#FFFFFF";
  let ring=c[1];if(Math.abs(lum(ring)-lum(bg))<.04)ring=light?"#10131A":"#FFFFFF";
  let plate=c[1];if(Math.abs(lum(plate)-lum(bg))<.05||lum(plate)>.8)plate=light?"#10131A":shade(bg,.45);const pfg=lum(plate)>.42?"#10131A":"#FFFFFF";
  return {bg,fg,ring,plate,pfg}}
function puckBase(a){const {bg,fg,ring}=emColors(a);return `<circle cx="60" cy="60" r="56" fill="${bg}"/><circle cx="60" cy="60" r="49" fill="none" stroke="${ring}" stroke-width="3.2"/><circle cx="60" cy="60" r="44" fill="none" stroke="${fg}" stroke-opacity=".22" stroke-width="1"/>`}
function emblemSprite(){return `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>${Object.keys(COLORS).map(a=>{const {fg}=emColors(a);
  return `<symbol id="e-${a}" viewBox="0 0 120 120">${puckBase(a)}<text x="60" y="72.5" text-anchor="middle" font-family="${EMF}" font-weight="800" font-size="37" letter-spacing="1.5" fill="${fg}">${a}</text></symbol>`}).join("")}</defs></svg>`}
let NUMN=null;const nrm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z]/g,"");
function pnum(name,pos){const N=(D&&D.numbers)||{};let n=pos!=null?N[name+"|"+pos]:null;if(n==null)n=N[name];if(n==null){if(!NUMN){NUMN={};for(const k in N)NUMN[nrm(k)]=N[k]}n=NUMN[nrm(name)]}if(n!=null)return String(n);const s=(D&&D.skaters||[]).find(x=>x.name===name)||(D&&D.goalies||[]).find(x=>x.name===name);return s&&s.num!=null?String(s.num):null}
function initials(n){return String(n||"").split(/\s+/).map(w=>w[0]||"").join("").slice(0,2).toUpperCase()}
function pk(name,team,cls="",pos){if(!COLORS[team])return badge(team,cls);const {fg,plate,pfg}=emColors(team);const num=pnum(name,pos);const full=/(^|\s)(m|l|xl)(\s|$)/.test(cls);
  const lab=num?"#"+num:initials(name);let inner;
  if(full)inner=`<text x="60" y="58" text-anchor="middle" font-family="${EMF}" font-weight="800" font-size="${lab.length>3?32:39}" fill="${fg}">${esc(lab)}</text><rect x="29" y="66" width="62" height="27" rx="3.5" fill="${plate}"/><text x="60" y="87.5" text-anchor="middle" font-family="${EMF}" font-weight="800" font-size="24" letter-spacing="2" fill="${pfg}">${team}</text>`;
  else inner=`<text x="60" y="${num?77:73}" text-anchor="middle" font-family="${EMF}" font-weight="800" font-size="${num?(num.length>1?50:56):40}" fill="${fg}">${esc(num||lab)}</text>`;
  return `<span class="bdg ${cls}" aria-hidden="true" title="${esc(name)}"><svg viewBox="0 0 120 120">${puckBase(team)}${inner}</svg></span>`}
function badge(a,cls=""){const c=COLORS[a]||["#556","#889"];const t=lum(c[0])>.45?"#0B1830":"#FFFFFF";return `<span class="bdg ${cls}" style="--c1:${c[0]};--c2:${c[1]};--t:${t}" aria-hidden="true">${esc(a)}</span>`}
function tcol(a){const c=COLORS[a]||["#556","#889"];const ok=x=>{const l=lum(x);return l>.07&&l<.75};return ok(c[0])?c[0]:ok(c[1])?c[1]:"#8FA6C8"}
function tdeep(a){const c=COLORS[a]||["#334","#556"];return lum(c[0])<.6?c[0]:c[1]}
function team(a,cls=""){return `<button class="tlink tm" data-team="${a}">${badge(a,cls)}<b>${esc(EN[a]||a)}</b></button>`}
function f2(x){return x==null||isNaN(x)?"—":Number(x).toFixed(2)}
function pct(x){return x==null?"—":Math.round(x*100)+"%"}
function rub(v){if(v==null)return"—";const s=Math.abs(Math.round(v)).toLocaleString("ru-RU");return (v>0?"+":v<0?"−":"")+s+" ₽"}
function sgn(v){return v>0?"pos":v<0?"neg":""}
function dShort(iso){const d=new Date(iso+"T12:00:00Z");return d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"}).replace(".","")}
function dLong(iso){const d=new Date(iso+"T12:00:00Z");return d.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"})}
function wd(iso){return new Date(iso+"T12:00:00Z").toLocaleDateString("ru-RU",{weekday:"short"})}
function kt(iso){return new Date(iso).toLocaleTimeString("ru-RU",{timeZone:"Europe/Kirov",hour:"2-digit",minute:"2-digit"})}
function kd(iso){return new Date(iso).toLocaleDateString("ru-RU",{timeZone:"Europe/Kirov",day:"numeric",month:"short",weekday:"short"}).replace(".","")}
function rel(iso){const ms=new Date(iso)-Date.now();if(ms<=0)return null;const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h>=24?`через ${Math.floor(h/24)} д`:h?`через ${h} ч ${m} мин`:`через ${m} мин`}
function state(iso){const ms=Date.now()-new Date(iso);return ms<0?"pre":ms<3.3*36e5?"live":"done"}
function nhlDate(iso){return new Date(new Date(iso)-6*36e5).toISOString().slice(0,10)}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const endTag=e=>e==="OT"?"ОТ":e==="SO"?"Б":"";

/* ---------- расчёты по архиву ---------- */
let TEAMS={};
function buildTeams(){
  TEAMS={};ALL.forEach(a=>TEAMS[a]={abbr:a,gp:0,w:0,l:0,otl:0,pts:0,gf:0,ga:0,rw:0,hw:0,hl:0,ho:0,aw:0,al:0,ao:0,games:[]});
  const gs=A.games.slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.id-y.id);
  for(const g of gs){for(const [s,o,gf,ga,home] of [[g.away,g.home,g.as,g.hs,false],[g.home,g.away,g.hs,g.as,true]]){
    const t=TEAMS[s];if(!t)continue;t.gp++;t.gf+=gf;t.ga+=ga;
    const r=gf>ga?"W":g.end==="REG"?"L":"O";
    if(r==="W"){t.w++;t.pts+=2;if(g.end==="REG")t.rw++;home?t.hw++:t.aw++}else if(r==="L"){t.l++;home?t.hl++:t.al++}else{t.otl++;t.pts++;home?t.ho++:t.ao++}
    t.games.push({id:g.id,date:g.date,opp:o,home,gf,ga,end:g.end,r});}}
  for(const t of Object.values(TEAMS)){const g=t.games;let k=0;const last=g[g.length-1];if(last){for(let i=g.length-1;i>=0&&g[i].r===last.r;i--)k++;t.streak=(last.r==="W"?"В":last.r==="L"?"П":"ОТ")+k;t.sr=last.r}
    const l10=g.slice(-10);t.l10=`${l10.filter(x=>x.r==="W").length}-${l10.filter(x=>x.r==="L").length}-${l10.filter(x=>x.r==="O").length}`;
    t.pp=t.gp?t.pts/(2*t.gp):0;}
}
function cmp(a,b){return b.pts-a.pts||b.pp-a.pp||b.rw-a.rw||b.w-a.w||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf}
function rec(a){const t=TEAMS[a];return t?`${t.w}-${t.l}-${t.otl}`:""}
function formDots(a,n=5){const g=(TEAMS[a]?.games||[]).slice(-n);if(!g.length)return"";return `<span class="fd" aria-label="форма">${g.map(x=>`<i class="${x.r}" title="${esc(dShort(x.date))} ${x.home?"дома":"в гостях"} ${esc(EN[x.opp])} ${x.gf}:${x.ga}${x.end!=="REG"?" "+endTag(x.end):""}">${x.r==="W"?"В":x.r==="O"?"О":"П"}</i>`).join("")}</span>`}
function place(a){const div=DIVS.find(d=>d[3].includes(a));const arr=div[3].map(x=>TEAMS[x]).sort(cmp);return arr.findIndex(t=>t.abbr===a)+1}
function modelOf(m){return (M.games||[]).find(x=>x.away===m.away&&x.home===m.home)}
function sideTeam(m,side){return side==="home"?m.home:m.away}
function pickLabel(j){const t=j.type||j.kind||"win";
  if(t==="win")return j.side?EN[sideTeam(j,j.side)]:esc(j.pick);
  if(t==="total")return `${(j.side==="over"||j.side==="больше")?"ТБ":"ТМ"} ${j.line}`;
  if(t==="express")return (j.legs||[]).map(l=>l.side?EN[sideTeam(l,l.side)]:l.pick).join(" + ");
  return esc(j.label||j.pick||"Ставка")}
function matchLabel(j){const t=j.type||j.kind;if(t==="express")return (j.legs||[]).map(l=>`${EN[l.away]} — ${EN[l.home]}`).join(" · ");return j.away?`${EN[j.away]} — ${EN[j.home]}`:""}
function gameOf(date,away,home){return A.games.find(g=>g.away===away&&g.home===home&&(!date||g.date===date))}
function legRes(l,date){const g=gameOf(date,l.away,l.home);if(!g)return null;const hw=g.hs>g.as;return (l.side==="home")===hw?"hit":"miss"}
function autoRes(b){const t=b.kind||b.type;if(t==="win")return legRes(b,b.date);
  if(t==="total"){const g=gameOf(b.date,b.away,b.home);if(!g)return null;const tot=g.as+g.hs;if(tot===Number(b.line))return"void";return (b.side==="over")===(tot>b.line)?"hit":"miss"}
  if(t==="express"){const r=(b.legs||[]).map(l=>legRes(l,b.date));if(r.includes("miss"))return"miss";if(r.every(x=>x==="hit"))return"hit";return null}
  return null}
function scoreOf(b){const g=gameOf(b.date,b.away,b.home);return g?`${g.as}:${g.hs}${g.end!=="REG"?" "+endTag(g.end):""}`:""}
function plOf(res,odds,stake){return res==="hit"?stake*(odds-1):res==="miss"?-stake:res==="void"?0:null}

/* ---------- навигация ---------- */
function renderDock(){$("#dock").innerHTML=NAV.map(([k,l])=>`<button data-nav="${k}" ${isNav(k)?'aria-current="page"':""}>${IC[k==="results"?"res":k]}<span>${l}</span></button>`).join("")}
function isNav(k){return VIEW===k||(k==="more"&&MORE.some(m=>m[0]===VIEW))}
function go(v,push=true){VIEW=v;if(push)try{history.replaceState(null,"","#"+v)}catch(e){}render();window.scrollTo(0,0)}
let LASTV=null;
function countUp(){document.querySelectorAll("[data-count]").forEach(el=>{const v=+el.dataset.count;if(!v)return;const t0=performance.now(),d=650;const step=t=>{const k=Math.min(1,(t-t0)/d);el.textContent=Math.round(v*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};el.textContent="0";requestAnimationFrame(step)})}
function render(){renderDock();const fresh=LASTV!==VIEW;LASTV=VIEW;const f={home:vHome,games:vGames,model:vModel,results:vResults,table:vTable,picks:vPicks,more:vMore,news:vNews,teams:vTeams,power:vPower,lead:vLead,inj:vInj,rus:vRus}[VIEW]||vHome;const app=$("#app");app.classList.toggle("anim",fresh);app.innerHTML=`<div class="view">${f()}</div>`;after();if(fresh&&!matchMedia("(prefers-reduced-motion: reduce)").matches)countUp()}

/* ---------- главная ---------- */
function lastDate(){return A.games.reduce((m,g)=>g.date>m?g.date:m,"")}
function ticker(){const d=lastDate();const gs=A.games.filter(g=>g.date===d);return `<div class="ticker" role="list">${gs.map(g=>{const aw=g.as>g.hs;return `<button class="tk" role="listitem" data-res="${g.date}" data-gid="${g.id}"><small>${endTag(g.end)?endTag(g.end)+" · ":""}${esc(dShort(g.date))}</small><div class="r ${aw?"":"lose"}"><span>${badge(g.away,"s")}${EN[g.away]}</span>${g.as}</div><div class="r ${aw?"lose":""}"><span>${badge(g.home,"s")}${EN[g.home]}</span>${g.hs}</div></button>`}).join("")}</div>`}
function probBar(p,a,h){return `<div><div class="bar"><i style="width:${p.p_away*100}%;background:${tcol(a)}"></i><i style="width:${p.p_home*100}%;background:${tcol(h)}"></i></div><div class="barlab"><span>${EN[a]} ${pct(p.p_away)}</span><span>${pct(p.p_home)} ${EN[h]}</span></div></div>`}
function oddsRow(m){const f=m.fonbet,o=m.odds;const ps=m.pick_side;if(!f&&!o)return"";const ah=f?[f.away,f.home]:[o.away,o.home];const t=f?f:{total:o.total,over:o.over,under:o.under};
  const ts=m.total_pick&&m.total_pick.line===t.total?m.total_pick.side:null;
  return `<div class="odds-row"><div class="od ${ps==="away"?"pick":""}"><small>${m.away}</small>${f2(ah[0])}</div><div class="od ${ps==="home"?"pick":""}"><small>${m.home}</small>${f2(ah[1])}</div><div class="od ${ts==="over"?"pick":""}"><small>ТБ ${t.total}</small>${f2(t.over)}</div><div class="od ${ts==="under"?"pick":""}"><small>ТМ ${t.total}</small>${f2(t.under)}</div></div>`}
function motdCard(){const mo=D.motd;if(!mo)return"";const m=D.upcoming.find(x=>x.away===mo.away&&x.home===mo.home);if(!m)return"";const p=modelOf(m);const st=state(m.start);

function injOut(a){return ((D.teams[a]||{}).injuries||[]).filter(x=>/IR|Out|LTIR|DTD/i.test(x.status||""))}
function gameRow(m){const key=`${m.away}-${m.home}`,open=OPEN.has(key);const p=modelOf(m);const st=state(m.start);
  const pickT=m.pick_side?sideTeam(m,m.pick_side):null;

  const head=`<button class="gm-row" data-tog="${key}" aria-expanded="${open}"><div class="gm-time"><b>${kt(m.start)}</b><small>${st==="live"?'<span class="chip live">LIVE</span>':st==="done"?"завершён":esc(rel(m.start)||"")}</small></div>
   <div class="gm-teams"><div class="tm">${badge(m.away)}<b>${EN[m.away]}</b><span class="hide-s">${formDots(m.away)}</span></div><div class="tm">${badge(m.home)}<b>${EN[m.home]}</b><span class="hide-s">${formDots(m.home)}</span></div></div>
   <div class="gm-side">${pickT?`<span class="mine">${EN[pickT]}${tp?`<br>${tp.side==="over"?"ТБ":"ТМ"} ${tp.line}`:""}</span>`:""}<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div></button>`;
  if(!open)return `<article class="card gm">${head}</article>`;
  const ga=m.goalies||[];
  const valH=p&&p.value?`<span class="chip val">перевес модели: ${EN[sideTeam(m,p.value)]}</span>`:"";
  const ma=p&&p.mkt_home!=null;
  const injA=injOut(m.away),injH=injOut(m.home);
  const h2h=(p&&p.h2h)||[];
  return `<article class="card gm open">${head}<div class="gm-x">
   ${oddsRow(m)}${m.fonbet?`<p class="note">Сверху кэфы Фонбета.</p>`:m.odds?`<p class="note">Сверху линия-ориентир: победа с учётом ОТ и тотал${D.odds_updated?`, сняты ${esc(new Date(D.odds_updated).toLocaleString("ru-RU",{timeZone:"Europe/Kirov",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}`:""}.</p>`:""}${booksTable(m)}${softBlock(p)}
   <div class="pickbox"><div class="h"><span class="h3">Прогноз · исход</span>${m.odds||m.fonbet?`<span class="chip">${f2(m.fonbet?(m.pick_side==="home"?m.fonbet.home:m.fonbet.away):(m.pick_side==="home"?m.odds.home:m.odds.away))}</span>`:""}</div><b>${pickT?EN[pickT]:esc(m.pick)} побеждает</b><p>${esc(m.lean||"")}</p></div>
   ${tp?`<div class="pickbox"><div class="h"><span class="h3">Прогноз · тотал</span><span class="chip">${f2(tp.odds)}</span></div><b>${tp.side==="over"?"Больше":"Меньше"} ${esc(tp.line)}</b><p>${esc(tp.lean||"")}</p></div>`:""}
   ${p?`<div class="sec"><div class="sec-h"><span class="h3">Модель</span>${valH}</div>${probBar(p,m.away,m.home)}
     <div class="kv"><div><small>ОЖИДАЕМЫЕ ГОЛЫ</small><b>${p.lam_away.toFixed(1)} : ${p.lam_home.toFixed(1)}</b></div><div><small>ШАНС ОВЕРТАЙМА</small><b>${pct(p.p_ot)}</b></div><div><small>ТБ ${p.line}</small><b>${pct(p.p_over)}</b></div><div><small>ТМ ${p.line}</small><b>${pct(p.p_under)}</b></div></div>
     ${ma?`<div class="tbl-wrap"><table class="mtab"><thead><tr><th>Исход</th><th>Модель</th><th>Рынок*</th><th>Честный кэф</th><th>Разница</th></tr></thead><tbody>
      <tr><td>${EN[m.away]}</td><td>${pct(p.p_away)}</td><td>${pct(p.mkt_away)}</td><td>${f2(p.fair_away)}</td><td class="${sgn(p.edge_away)}">${p.edge_away>0?"+":""}${Math.round(p.edge_away*100)} п.п.</td></tr>
      <tr><td>${EN[m.home]}</td><td>${pct(p.p_home)}</td><td>${pct(p.mkt_home)}</td><td>${f2(p.fair_home)}</td><td class="${sgn(p.edge_home)}">${p.edge_home>0?"+":""}${Math.round(p.edge_home*100)} п.п.</td></tr>
      ${p.mkt_over!=null?`<tr><td>ТБ ${p.line}</td><td>${pct(p.p_over)}</td><td>${pct(p.mkt_over)}</td><td>${f2(1/p.p_over)}</td><td class="${sgn(p.edge_over)}">${p.edge_over>0?"+":""}${Math.round(p.edge_over*100)} п.п.</td></tr>`:""}
     </tbody></table></div><p class="note">* Рынок — вероятности по линии-ориентиру без маржи.</p>`:""}
     <ul class="why">${modelWhy(m,p).map(x=>`<li><span>${x}</span></li>`).join("")}</ul></div>`:""}
   ${(m.factors||[]).length?`<div class="sec"><span class="h3">Почему так</span><ul class="why">${m.factors.map(x=>`<li><span>${esc(x)}</span></li>`).join("")}</ul></div>`:""}
   <div class="sec"><span class="h3">Вратари</span><div class="kv">${[0,1].map(i=>{const t=i?m.home:m.away;const gp=p&&(i?p.goalie_home:p.goalie_away);return `<div><small>${t}</small><b style="font-size:14.5px">${esc(ga[i]||"не объявлен")}</b>${gp&&gp.sv?`<small>${(gp.sv*100).toFixed(1)}% отражённых · ${gp.gp} и.</small>`:""}</div>`}).join("")}</div></div>
   ${(injA.length||injH.length)?`<div class="sec"><span class="h3">Без кого играют</span>${[[m.away,injA],[m.home,injH]].filter(x=>x[1].length).map(([t,l])=>`<div class="inj">${badge(t,"s")}${l.map(x=>`<span class="chip">${esc(x.name)} · ${esc(x.status)}</span>`).join("")}</div>`).join("")}</div>`:""}
   <div class="sec"><span class="h3">Личные встречи в сезоне</span>${h2h.length?h2h.map(g=>`<div class="small">${esc(dShort(g.date))}: ${EN[g.away]} — ${EN[g.home]} <b>${esc(g.score)}</b>${g.end&&g.end!=="REG"?" "+endTag(g.end):""}</div>`).join(""):'<span class="small muted">В этом сезоне ещё не встречались.</span>'}</div>
   <div class="acts"><button class="btn ghost" data-team="${m.away}">${EN[m.away]}: карточка</button><button class="btn ghost" data-team="${m.home}">${EN[m.home]}: карточка</button></div>
  </div></article>`}
function modelWhy(m,p){const out=[];const ra=p.rating_away,rh=p.rating_home;const nm=x=>String(x||"").split("(")[0].trim();
  out.push(`Сила по матчам сезона с поправкой на прошлый: ${EN[m.away]} — атака ${Math.round(ra.att*100)}, оборона ${Math.round(100/ra.dfn)}; ${EN[m.home]} — атака ${Math.round(rh.att*100)}, оборона ${Math.round(100/rh.dfn)}. 100 — средний уровень лиги.`);
  if(M.league&&M.league.home_adv!=null)out.push(`Своя площадка: в этом сезоне хозяева забивают в среднем на ${Math.round(M.league.home_adv*100)}% больше гостей, модель это учитывает.`);
  for(const [t,g,o] of [[m.away,p.goalie_away,m.home],[m.home,p.goalie_home,m.away]]){if(g&&g.name&&g.factor&&Math.abs(g.factor-1)>=.02)out.push(`${nm(g.name)} (${EN[t]}) по сейвам сверх ожидаемого ${g.factor>1?"ниже":"выше"} среднего вратаря лиги: ожидаемые голы ${EN[o]} ${g.factor>1?"+":"−"}${Math.round(Math.abs(1-g.factor)*100)}%.`)}
  for(const [t,l,adj,def] of [[m.away,p.inj_away,p.inj_adj_away,p.inj_def_away],[m.home,p.inj_home,p.inj_adj_home,p.inj_def_home]]){if(l&&l.length)out.push(`Без ${l.map(x=>x.basis==="toi"&&x.toi?`${x.name} (защитник, ${String(x.toi.toFixed(1)).replace(".",",")} мин за матч)`:x.ixg_pg!=null?`${x.name} (${String(x.ixg_pg.toFixed(2)).replace(".",",")} xG за матч)`:`${x.name} (${Math.round((x.share||0)*100)}% очков команды)`).join(", ")}: атака ${EN[t]} −${Math.round(adj*100)}%${def?`, соперник забивает +${Math.round(def*100)}%`:""}.`)}
  if(p.b2b_away||p.b2b_home)out.push(`Второй матч за два дня: ${[p.b2b_away&&EN[m.away],p.b2b_home&&EN[m.home]].filter(Boolean).join(" и ")}. Это самый надёжный фактор на истории: модель снимает уставшей команде 5% голов и добавляет столько же сопернику.`);
  for(const [t,f] of [[m.away,p.out_away],[m.home,p.out_home]])if(f)out.push(`${EN[t]} уже почти вне борьбы за плей-офф: в концовке сезона такие команды играют слабее, модель снимает 3%.`);
  for(const [t,f] of [[m.away,p.new_coach_away],[m.home,p.new_coach_home]])if(f)out.push(`У ${EN[t]} новый главный тренер: первые 10 матчей после смены команды обычно играют лучше ожиданий, модель добавляет 5%.`);
  if(p.p_ot_home!=null&&p.p_ot>=.2)out.push(`Шанс ничьей в основное время ${pct(p.p_ot)}. В овертайме 3 на 3 сильнейший выигрывает чаще, поэтому после ничьей модель даёт ${EN[m.home]} ${pct(p.p_ot_home)}.`);
  if(p.value)out.push(`Модель оценивает шансы ${EN[sideTeam(m,p.value)]} выше рынка больше чем на 5 п.п. Кэфы в расчёт не входят, это только сравнение готового мнения с рынком.`);
  return out.map(esc)}
function booksTable(m){const f=m.fonbet,o=m.odds,x=m.odds_1x,bk=m.books||{};if(!f&&!o&&!x&&!Object.keys(bk).length)return"";const r=(name,note,a,h,t)=>`<tr><td>${name}<br><small class="muted">${note}</small></td><td>${f2(a)}</td><td>${f2(h)}</td><td>${t&&t.total!=null?`${t.total}: ${f2(t.over)} / ${f2(t.under)}`:"—"}</td></tr>`;
  const BN={marathonbet:"Линия 3",onexbet:"Линия 2"};
  return `<div class="tbl-wrap"><table class="mtab"><thead><tr><th>Линия</th><th>${m.away}</th><th>${m.home}</th><th>Тотал Б / М</th></tr></thead><tbody>

   ${x&&x.home?r("Линия 2",`основное время, ничья ${f2(x.draw)}`,x.away,x.home,x):""}
   ${Object.entries(bk).filter(([k])=>k!=="onexbet"||!x).map(([k,b])=>r(BN[k]||esc(k),b.draw?`основное время, ничья ${f2(b.draw)}`:"с ОТ",b.away,b.home,b)).join("")}</tbody></table></div>`}

function weekBlock(){const w=(D.week||[]).filter(g=>g.date>(D.upcoming_date||""));if(!w.length)return"";const by={};w.forEach(g=>(by[g.date]=by[g.date]||[]).push(g));

function dates(){return [...new Set(A.games.map(g=>g.date))].sort()}
function goalsBlock(g){if(!g.goals||!g.goals.length)return g.end==="SO"&&g.as+g.hs===1?'<p class="small muted" style="margin:0">Голов в игре не было, победа в серии буллитов.</p>':"";const per={};g.goals.forEach(x=>(per[x[3]]=per[x[3]]||[]).push(x));
  const pn=k=>k==4?"Овертайм":k==5?"Буллиты":`${k}-й период`;const st={pp:"бол.",sh:"мен.",en:"п.в."};

/* ---------- прогнозы ---------- */
function claudeStats(filter="all"){const j=(D.journal||[]).filter(x=>filter==="all"||(x.type||"win")===filter);const done=j.filter(x=>x.result&&x.odds);let bank=0;done.forEach(x=>bank+=plOf(x.result,x.odds,STAKE));const hit=done.filter(x=>x.result==="hit").length;return {list:j,n:done.length,hit,bank,roi:done.length?bank/(done.length*STAKE):null}}
function userBetsResolved(){return BETS.map(b=>{const r=b.result||autoRes(b);return {...b,res:r,pl:plOf(r,Number(b.odds),Number(b.stake)||STAKE),flatpl:plOf(r,Number(b.odds),STAKE)}})}
function userStats(){const bs=userBetsResolved().filter(b=>b.res&&b.res!=="void");const all=userBetsResolved().filter(b=>b.res);const real=all.reduce((s,b)=>s+(b.pl||0),0);const flat=all.reduce((s,b)=>s+(b.flatpl||0),0);const staked=all.reduce((s,b)=>s+(b.res==="void"?0:Number(b.stake)||STAKE),0);return {n:bs.length,hit:bs.filter(b=>b.res==="hit").length,real,flat,roi:staked?real/staked:null}}
function series(items,dateKey,plKey){const by={};items.forEach(x=>{if(x[plKey]==null)return;by[x[dateKey]]=(by[x[dateKey]]||0)+x[plKey]});let c=0;return Object.keys(by).sort().map(d=>[d,c+=by[d]])}
function lineChart(sers,id){const all=[...new Set(sers.flatMap(s=>s.pts.map(p=>p[0])))].sort();if(!all.length)return `<div class="empty">График появится после первых рассчитанных прогнозов.</div>`;
  const W=640,H=220,L=56,R=16,T=16,B=28;const vals=sers.flatMap(s=>s.pts.map(p=>p[1])).concat([0]);let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo-=1000;hi+=1000}
  const step=niceStep((hi-lo)/4);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const x=i=>all.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(all.length-1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let g="";for(let v=lo;v<=hi+1e-6;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?"rgba(128,128,128,.55)":"rgba(128,128,128,.18)"}" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#7C88A1">${v===0?"0":(v>0?"+":"−")+Math.abs(v/1000).toLocaleString("ru-RU")+"к"}</text>`;
  const lbl=[0,all.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="${all.length===1?"middle":i?"end":"start"}" font-size="11" fill="#8592A8">${esc(dShort(all[i]))}</text>`).join("");
  const lines=sers.map(s=>{const pts=all.map((d,i)=>{let v=null;for(const p of s.pts)if(p[0]<=d)v=p[1];return v==null?null:[x(i),y(v)]}).filter(Boolean);if(!pts.length)return"";const last=pts[pts.length-1];
    return `<polyline pathLength="1" points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="${s.color}" stroke="#0D1524" stroke-width="2"/>`}).join("");
  CHARTS[id]={all,sers,x,y,W,H};
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Баланс по дням">${g}${lbl}${lines}<line class="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#EEF3FA" stroke-width="1" opacity="0"/><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div></div>`}
const CHARTS={};
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(Math.max(r,1))));const m=r/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}
function bindCharts(){document.querySelectorAll(".chart").forEach(el=>{const c=CHARTS[el.dataset.chart];if(!c)return;const svg=el.querySelector("svg"),tip=el.querySelector(".tip"),cross=el.querySelector(".cross");
  const move=e=>{const r=svg.getBoundingClientRect();const sx=(e.clientX-r.left)*c.W/r.width;let bi=0,bd=1e9;c.all.forEach((d,i)=>{const dd=Math.abs(c.x(i)-sx);if(dd<bd){bd=dd;bi=i}});const d=c.all[bi];
   cross.setAttribute("x1",c.x(bi));cross.setAttribute("x2",c.x(bi));cross.setAttribute("opacity",".25");
   tip.hidden=false;tip.style.left=(c.x(bi)/c.W*r.width)+"px";tip.style.top="30px";tip.innerHTML=`<b>${esc(dLong(d))}</b>`+c.sers.map(s=>{let v=null;for(const p of s.pts)if(p[0]<=d)v=p[1];return `<div><span style="color:${s.color}">●</span> ${esc(s.name)}: ${v==null?"—":rub(v)}</div>`}).join("")};
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerleave",()=>{tip.hidden=true;cross.setAttribute("opacity","0")})})}
function jRow(x,{res,pl,score,mine}){const t=x.type||x.kind||"win";const TY={win:"Исход",total:"Тотал",express:"Уверенные",other:"Другое"};

   <div class="card jr">${s.list.length?s.list.slice().reverse().map(x=>jRow(x,{res:x.result,pl:x.result&&x.odds?plOf(x.result,x.odds,STAKE):null,score:x.score})).join(""):'<div class="empty">Пока пусто</div>'}</div>
   <p class="legend">Условная ставка 1000 ₽ на каждый прогноз. Кэфы — Pinnacle через The Odds API на момент вечернего обновления (до 11 октября — DraftKings). Исход — победа с учётом ОТ и буллитов, тотал — все голы, включая ОТ (победа по буллитам считается как один гол), экспресс заходит, только если сыграли все исходы.</p>`}
function gameOptions(){const now=Date.now();const src=(D.week&&D.week.length?D.week:D.upcoming).filter(g=>new Date(g.start)>now-3.3*36e5);return src.map(g=>`<option value="${g.away}|${g.home}|${g.date||nhlDate(g.start)}">${esc(kd(g.start))} · ${EN[g.away]} — ${EN[g.home]}</option>`).join("")}
function pMine(){const u=userStats();const list=userBetsResolved().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.created||0)-(a.created||0));
  const kind=ls("bf-kind")||"win";

   <div class="sum"><div class="card"><b class="${sgn(u.real)}">${u.n?rub(u.real):"—"}</b><small>баланс по твоим суммам</small></div><div class="card"><b class="${sgn(u.roi)}">${u.roi==null?"—":(u.roi>0?"+":"")+Math.round(u.roi*100)+"%"}</b><small>окупаемость</small></div><div class="card"><b>${u.hit}/${u.n}</b><small>угадано</small></div><div class="card"><b class="${sgn(u.flat)}">${u.n?rub(u.flat):"—"}</b><small>если по 1000 ₽</small></div></div>

function fonFor(away,home){const u=(D.upcoming||[]).find(m=>m.away===away&&m.home===home&&(m.odds||m.fonbet));return u?(u.odds||u.fonbet):null}
function autoOdds(){const k=$("#bf-kind")?.value,o=$("#bf-odds"),note=$("#bf-msg");if(!o||!k||k==="other")return;let v=null;
  if(k==="express"){if(BET_LEGS.length>=2){const os=BET_LEGS.map(l=>{const f=fonFor(l.away,l.home);return f&&f[l.side]});if(os.every(Boolean))v=os.reduce((a,b)=>a*b,1)}}
  else{const [a,h]=($("#bf-game").value||"||").split("|");const f=fonFor(a,h);const sd=$("#bf-side")?.value;if(f){if(k==="win")v=f[sd];else if(k==="total"){const ln=parseFloat(($("#bf-line")?.value||"").replace(",","."));if(ln===Number(f.total))v=sd==="over"?f.over:f.under}}}
  if(v){o.value=Number(v).toFixed(2);note.textContent="кэф Pinnacle из API, поправь на свой"}else{note.textContent=k==="total"?"по этой линии кэфа нет, впиши сам":"кэфа на этот матч пока нет, впиши сам"}}
function dynFields(kind){const sel=($("#bf-game")||{}).value||"";const [a,h]=sel.split("|");

  if(!(odds>1)){msg.textContent="Укажи кэф больше 1, например 1.85.";return}

  if(kind==="express"){if(BET_LEGS.length<2){msg.textContent="В экспрессе нужно минимум два исхода.";return}b.legs=BET_LEGS.slice();b.date=BET_LEGS[0].date;b.away=null;b.home=null}

function badge(a,cls=""){if(!COLORS[a])return `<span class="bdg ${cls}" aria-hidden="true"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="55" fill="#556070"/><text x="60" y="72" text-anchor="middle" font-family="${EMF}" font-size="34" font-weight="800" fill="#fff">${esc(a)}</text></svg></span>`;

  const b=lum(c0[1])>.5||Math.abs(lum(c0[1])-lum(c0[0]))<.03?shade(c0[0],.55):c0[1];return [c0[0],b]}

function lastNPoints(n=5){const by={};const games=A.games.slice().sort((x,y)=>x.date<y.date?-1:1);const teamG={};
  for(const g of games){for(const t of [g.away,g.home]){(teamG[t]=teamG[t]||[]).push(g)}}
  const pts={};for(const t in teamG){const gs=teamG[t].slice(-n);for(const g of gs){for(const x of (g.goals||[])){if(x[1]!==t)continue;if(x[3]===5)continue;const add=(s,k)=>{s=String(s||"").trim();if(!s)return;const key=t+"|"+s;pts[key]=pts[key]||{g:0,a:0};pts[key][k]++};add(x[0],"g");String(x[5]||"").split(",").forEach(s=>add(s,"a"))}}}
  return pts}
function hotList(){const L=lastNPoints(5);const S=D.skaters||[];const ln=s=>s.name.split(" ").slice(1).join(" ");
  const rows=S.filter(s=>s.gp>=3).map(s=>{const p=L[s.team+"|"+ln(s)]||L[s.team+"|"+s.name.split(" ").pop()]||{g:0,a:0};return {...s,l5g:p.g,l5a:p.a,l5:p.g+p.a}});

let MF="all";
const VL={bet:["Модель выше рынка","val"],lean:["Чуть выше рынка","gold"],pass:["Согласна с рынком",""],noodds:["Линии пока нет","no"]};
function nz(x,d=1){return String((+x).toFixed(d)).replace(".",",")}
function srcOf(p){return (D.upcoming||[]).find(x=>x.away===p.away&&x.home===p.home&&(!x.date||!p.date||x.date===p.date))||(D.week||[]).find(x=>(p.id&&x.id===p.id)||(x.away===p.away&&x.home===p.home&&x.date===p.date))||{away:p.away,home:p.home,start:p.start}}
function mGames(){const seen=new Set();return [...(M.games||[]),...(M.horizon||[])].map(p=>{const m=srcOf(p);return {p,m,start:p.start||m.start}}).filter(({p,start})=>{const k=p.id||p.away+p.home+p.date;if(seen.has(k)||!start)return false;seen.add(k);return state(start)==="pre"}).sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0)}
function pB(p,s){return p["p_"+s+"_blend"]??p["p_"+s]}
function abbrRu(t){return String(t||"").replace(/\b[A-Z]{3}\b/g,a=>EN[a]||a)}
function betLine(v,p){const b=v.bet;if(!b)return"";if(b.kind==="win")return `${EN[sideTeam(p,b.side)]} — победа с ОТ, ${f2(b.odds)} (рынок)`;return `${esc(b.book)}: ${esc(abbrRu(b.bet))}, ${f2(b.odds)}`}
function betShort(v,p){const b=v.bet;if(!b)return"";if(b.kind==="win")return `${EN[sideTeam(p,b.side)]} ${f2(b.odds)}`;return `${esc(abbrRu(b.bet).replace(" (осн. время)",""))} ${f2(b.odds)}`}
function autoEssay(p){const a=p.away,h=p.home;const ph=pB(p,"home"),pa=pB(p,"away");const fs=ph>=pa?"home":"away",fav=sideTeam(p,fs),pf=Math.max(ph,pa);
  const ra=p.rating_away,rh=p.rating_home;const at=r=>Math.round(r.att*100),df=r=>Math.round(100/r.dfn);const out=[];
  let s=pf<.54?`Почти равный матч: ${EN[fav]} чуть вероятнее (${pct(pf)} на победу с учётом овертайма).`:pf<.62?`${EN[fav]} — умеренный фаворит: ${pct(pf)} на победу с учётом овертайма.`:`${EN[fav]} — явный фаворит: ${pct(pf)} на победу с учётом овертайма.`;
  const why=[];const dA=at(rh)-at(ra),dD=df(rh)-df(ra);
  if(Math.abs(dA)>=5)why.push(`атака ${EN[dA>0?h:a]} заметно сильнее (${Math.max(at(rh),at(ra))} против ${Math.min(at(rh),at(ra))}, 100 — средний уровень лиги)`);
  if(Math.abs(dD)>=5)why.push(`оборона надёжнее у ${EN[dD>0?h:a]} (${Math.max(df(rh),df(ra))} против ${Math.min(df(rh),df(ra))})`);
  if(!why.length)why.push(`по силе за сезон команды близки (атака ${at(ra)} и ${at(rh)}, оборона ${df(ra)} и ${df(rh)}), так что многое решает своя площадка`);
  if(p.b2b_away&&!p.b2b_home)why.push(`${EN[a]} играет второй матч за два дня — самый надёжный фактор на истории`);
  if(p.b2b_home&&!p.b2b_away)why.push(`${EN[h]} играет второй матч за два дня — самый надёжный фактор на истории`);
  for(const [t,l] of [[a,p.inj_away],[h,p.inj_home]])if(l&&l.length)why.push(`у ${EN[t]} нет ${l.map(x=>x.name.split(" ").slice(-1)[0]).join(", ")}`);
  if(p.pacific_home)why.push(`хозяева с Тихоокеанского побережья на истории выигрывают дома реже, чем положено по силе`);
  for(const [t,f] of [[a,p.new_coach_away],[h,p.new_coach_home]])if(f)why.push(`у ${EN[t]} новый тренер — первые матчи после смены обычно лучше ожиданий`);
  if(Math.abs(p.shares_adj||0)>=.1)why.push(`по структуре моментов (дальние броски опаснее обычного при том же владении) модель добавляет ${EN[p.shares_adj>0?h:a]}`);
  s+=" Главное: "+why.join("; ")+".";out.push(s);
  let s2="";
  if(p.mkt_home!=null){const e=p["edge_"+fs],mk=p["mkt_"+fs],md=p["p_"+fs];s2=`Рынок даёт ${EN[fav]} ${pct(mk)}, модель — ${pct(md)}.`+(Math.abs(e)<.03?" Мнения почти совпадают.":e>0?" Модель увереннее рынка.":" Модель осторожнее рынка.")}
  else s2=`Кэфов ещё нет, так что это чистая оценка модели${(p.goalie_home&&!p.goalie_home.name)?"; вратари не объявлены — взят средний уровень вратарей команды":""}.`;
  s2+=` Ожидается около ${nz(p.exp_total)} гола: на «больше ${nz(p.line,1).replace(",0","")}» — ${pct(p.p_over_blend??p.p_over)}.`;out.push(s2);return out}
function essayOf(p){const g=((D.model_tab||{}).games||{})[p.id];if(g)return Array.isArray(g)?g:String(g).split(/\n\n+/);return autoEssay(p)}
function verdictBox(p){const v=p.verdict||{};const fav=sideTeam(p,v.fav||"home");const [L,c]=VL[v.level]||["—",""];let main,txt;
  if((v.level==="bet"||v.level==="lean")&&v.bet){main=betLine(v,p);
    txt=v.bet.kind==="win"?`Модель ${pct(v.bet.p_model)} против ${pct(v.bet.p_mkt)} у рынка${v.fatigue?", и соперник играет второй матч за два дня":""}.`+(v.bet.side!==v.fav?" Это андердог: вероятнее соперник, но рынок его недооценивает.":""):`Цена выше честной (${f2(v.bet.fair)}) на ${Math.round((v.bet.ev||0)*100)}%. Это не прогноз исхода, а кэф дороже справедливого.`}
  else if(v.level==="pass"){main=`Вероятнее ${EN[fav]} — ${pct(v.p_fav)}`;txt="Модель и рынок оценивают матч одинаково."}

  const t=v.total;const tl=t?`<p>Тотал: ${t.side==="over"?"больше":"меньше"} ${nz(t.line,1).replace(",0","")} — ${pct(t.p)}${t.value?` · модель расходится с рынком на ${t.value==="over"?"ТБ":"ТМ"} 5+ п.п.`:""}.</p>`:"";
  return `<div class="pickbox vbox ${c}"><div class="h"><span class="h3">Оценка модели</span><span class="chip ${c}">${L}</span></div><b>${main}</b><p>${txt}</p>${tl}</div>`}
function mktTable(p){if(p.mkt_home==null)return"";const d=e=>`<td class="${sgn(e)}">${e>0?"+":""}${Math.round(e*100)}</td>`;

   <p class="note">* Итог — 60% рынка (Pinnacle без маржи) и 40% модели: на истории такая смесь точнее каждого по отдельности. ± — модель минус рынок, в процентных пунктах.</p>`}
function mRow({p,m,start}){const key="m"+(p.id||p.away+p.home),open=OPEN.has(key);const v=p.verdict||{};const [L,c]=VL[v.level]||["",""];const LS={bet:"Выше рынка",lean:"Чуть выше",pass:"Как рынок",noodds:"Без линии"}[v.level]||L;

   <div class="essay">${essayOf(p).map(x=>`<p>${esc(x)}</p>`).join("")}</div>

    <div class="kv"><div><small>ОЖИДАЕМЫЕ ГОЛЫ</small><b>${nz(p.lam_away)} : ${nz(p.lam_home)}</b></div><div><small>НИЧЬЯ В ОСН. ВРЕМЯ</small><b>${pct(p.p_ot)}</b></div><div><small>ТБ ${p.line}</small><b>${pct(p.p_over)}</b></div><div><small>ТМ ${p.line}</small><b>${pct(p.p_under)}</b></div></div>
    ${mktTable(p)}</div>
   ${hasOdds?`<div class="sec"><span class="h3">Кэфы</span>${booksTable(m)}${softBlock(p)}</div>`:`<p class="note">Кэфов пока нет: линия открывается примерно за сутки до матча. Тогда модель сравнит себя с рынком, и вердикт обновится.</p>`}
   <details class="sec"><summary class="h3" style="cursor:pointer">Из чего складывается оценка</summary><ul class="why" style="margin-top:10px">${modelWhy(p,p).map(x=>`<li><span>${x}</span></li>`).join("")}</ul></details>
   <div class="acts"><button class="btn ghost" data-team="${p.away}">${EN[p.away]}: карточка</button><button class="btn ghost" data-team="${p.home}">${EN[p.home]}: карточка</button></div>
  </div></article>`}
function mOverview(all){const mt=D.model_tab||{};const last=all.length?all[all.length-1].p.date:null;

  if(!paras){const top=all.slice().sort((x,y)=>Math.max(pB(y.p,"home"),pB(y.p,"away"))-Math.max(pB(x.p,"home"),pB(x.p,"away"))).slice(0,3);
    paras=[`На горизонте ${all.length} матчей${last?` — до ${dLong(last)}`:""}. Кэфы уже есть у ${withOdds}, модель выше рынка — в ${n("bet")}, чуть выше — в ${n("lean")}.`,

function mPicks(all){const bs=all.filter(g=>["bet","lean"].includes((g.p.verdict||{}).level)&&g.p.verdict.bet).sort((x,y)=>(x.p.verdict.level==="bet"?0:1)-(y.p.verdict.level==="bet"?0:1)||(x.start<y.start?-1:1));if(!bs.length)return"";

function vModel(){const all=mGames();if(!all.length)return `<div class="card empty">Будущих матчей в расписании пока нет — модель посчитает их после ближайшего обновления.</div>`;

   <details class="card pad"><summary class="h3" style="cursor:pointer">Как читать оценку</summary><ul class="why" style="margin-top:10px">
    <li><span><b>Модель выше рынка</b> — модель оценивает исход на 5+ п.п. выше рынка, или одна из линий заметно расходится с рынком, или соперник устал (второй матч за два дня) при перевесе от 2 п.п.</span></li>

   ${seg}${Object.keys(by).length?Object.entries(by).map(([d,gs])=>`<div class="sec"><div class="sec-h"><h2 style="font-size:19px">${esc(dLong(d))}</h2><span>${gs.length} ${gs.length===1?"матч":gs.length<5?"матча":"матчей"}</span></div>${gs.map(mRow).join("")}</div>`).join(""):'<div class="card empty">Под этот фильтр матчей нет.</div>'}</section>`}

function softW(){const gs=(M.games||[]).filter(g=>g.soft&&g.soft.length);if(!gs.length)return"";const rows=gs.flatMap(g=>g.soft.map(x=>({...x,g}))).sort((a,b)=>b.ev-a.ev).slice(0,6);

function pClaude(){const s=claudeStats(JF);const chips=[["all","Все"],["win","Исходы"],["total","Тоталы"],["express","Уверенные исходы"]];

   <p class="legend">Прогноз фиксируется до начала матча и задним числом не меняется. Условная доходность — если бы на каждый прогноз шла одна и та же единица по коэффициенту линии-ориентира. График — накопленный итог в таких единицах. Исход — победа с учётом ОТ и буллитов; тотал — все голы, включая ОТ (победа по буллитам считается одним голом); «уверенные исходы» засчитываются, только если сыграли все.</p>`}


function amRes(x){if(!x.changed||!x.result||x.result==="void")return x.result;const t=x.type||"win";
  if(t==="win")return (x.side_am||x.side)===x.side?x.result:(x.result==="hit"?"miss":"hit");
  if(t==="total"){const m=String(x.score||"").match(/(\d+):(\d+)/);if(!m)return null;const tot=+m[1]+ +m[2];const L=+(x.line_am??x.line),sd=x.side_am||x.side;return tot===L?"void":((tot>L)===(sd==="over")?"hit":"miss")}
  return null}
function amPmBlock(){const ch=(D.journal||[]).filter(x=>x.changed&&x.result&&x.result!=="void"&&(x.type||"win")!=="express");

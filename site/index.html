<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сводка НХЛ</title>
<meta name="description" content="Итоги ночи НХЛ, живой счёт, таблица, лидеры и прогнозы модели на каждый матч — по-русски, обновляется дважды в день.">
<meta property="og:title" content="Сводка НХЛ">
<meta property="og:description" content="Итоги ночи, три звезды, живой счёт и прогнозы модели с честным журналом точности.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#121418">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://assets.nhle.com" crossorigin>
<link id="fontcss" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&family=Unbounded:wght@700&display=swap">
<style>
/* ===== токены ===== */
:root{
  --bg:#ECEEF1;--card:#FFFFFF;--ink:#111317;--ink2:#3E434B;--mute:#6A707A;--line:#DDE0E5;--soft:#F3F4F6;--soft2:#E4E6EA;
  --bar:#121418;--strip:#1B1E24;--barink:#F2F4F7;--barmute:#9BA1AB;
  --red:#D7262F;--blue:#2F6FD6;--link:#1F5FCC;
  --gold:#A87400;--goldbg:#FBF1D6;--win:#13894F;--winbg:#E2F3E9;--loss:#C8323B;--lossbg:#FBE7E8;--ot:#B26B00;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Fira Sans Extra Condensed","Arial Narrow",sans-serif;
  --disp-k:1;           /* поправка размера для широких шрифтов заголовков */
  --fs-xs:12px;--fs-s:14px;--fs-m:16px;--fs-l:20px;--fs-xl:26px;--fs-2xl:34px;--fs-3xl:48px;
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:24px;--sp6:32px;
  --r:12px;--r2:8px;
  --shadow:0 1px 0 rgba(17,19,23,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F12;--card:#16191E;--ink:#EDEFF2;--ink2:#C3C7CE;--mute:#8C929C;--line:#2A2E35;--soft:#1E2228;--soft2:#2A2E35;
  --bar:#07080A;--strip:#111317;--red:#FF4A55;--blue:#6B9BFF;--link:#86AEFF;
  --gold:#E9C46A;--goldbg:#2B2412;--win:#3DCB80;--winbg:#13301F;--loss:#FF6B74;--lossbg:#351A1D;--ot:#E8AE4A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F12;--card:#16191E;--ink:#EDEFF2;--ink2:#C3C7CE;--mute:#8C929C;--line:#2A2E35;--soft:#1E2228;--soft2:#2A2E35;
  --bar:#07080A;--strip:#111317;--red:#FF4A55;--blue:#6B9BFF;--link:#86AEFF;
  --gold:#E9C46A;--goldbg:#2B2412;--win:#3DCB80;--winbg:#13301F;--loss:#FF6B74;--lossbg:#351A1D;--ot:#E8AE4A;color-scheme:dark}

/* ===== база ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:var(--fs-m);line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--link);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
img{display:block}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.disp{font-family:var(--f-disp);font-weight:700;letter-spacing:0}
.num{font-family:var(--f-disp);font-weight:700;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== шапка ===== */
.top{background:var(--bar);color:var(--barink);padding-top:env(safe-area-inset-top,0px);z-index:40}
@media (min-width:900px){.top{position:sticky;top:0}}
.top .wrap{display:flex;align-items:center;gap:24px;height:58px}
.mark{display:flex;align-items:center;gap:10px;color:var(--barink);flex:none}
.mark svg{width:38px;height:36px;flex:none}
.mark b{font-family:"Unbounded",var(--f-body);font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1}
.mark b span{font-weight:400;color:var(--barmute);margin-left:.28em}
.tnav{display:none}
@media (min-width:900px){
  .tnav{display:flex;height:100%;gap:2px}
  .tnav button{color:var(--barink);font-weight:600;font-size:var(--fs-m);padding:0 12px;height:100%;border-bottom:3px solid transparent;border-top:3px solid transparent;opacity:.78}
  .tnav button:hover{opacity:1}
  .tnav button[aria-current="page"]{opacity:1;border-bottom-color:var(--red)}
}
.upd{margin-left:auto;font-size:var(--fs-xs);color:var(--barmute);text-align:right;line-height:1.35}
.upd b{color:var(--barink);font-weight:600}
.upd.old b{color:#FFB4B8}

/* лента счетов */
.strip{background:var(--strip);color:var(--barink);border-bottom:1px solid #000}
.strip .wrap{display:flex;overflow-x:auto;scrollbar-width:none;padding-inline:0}
.strip .wrap::-webkit-scrollbar{display:none}
.sday{flex:none;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 14px;border-right:1px solid rgba(255,255,255,.08);font-size:var(--fs-xs);color:var(--barmute);line-height:1.1}
.sday b{font-family:var(--f-disp);font-size:22px;color:var(--barink)}
.sg{flex:none;display:flex;flex-direction:column;gap:5px;padding:9px 14px;min-width:150px;border-right:1px solid rgba(255,255,255,.08)}
.sg:hover{background:rgba(255,255,255,.05)}
.sg small{font-size:11px;font-weight:700;color:var(--barmute);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.sg small.live{color:#FF7A82}
.sg .r{display:flex;align-items:center;gap:8px;font-weight:600;font-size:var(--fs-s)}
.sg .r b{margin-left:auto;font-family:var(--f-disp);font-size:18px;font-weight:700}
.sg .r.lo{opacity:.55}
.strip .lg{background:#fff;border-radius:50%;padding:3px}

/* нижняя навигация */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:45;padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{display:grid;grid-template-columns:repeat(7,1fr);padding-inline:4px}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--mute);border-top:2px solid transparent}
.dock button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dock button[aria-current="page"]{color:var(--ink);border-top-color:var(--red)}
@media (min-width:900px){.dock{display:none}}
main{padding-top:var(--sp5);padding-bottom:110px;min-height:70vh}
@media (min-width:900px){main{padding-bottom:var(--sp6)}}
.foot{max-width:1240px;margin:0 auto;padding:0 16px 110px;font-size:var(--fs-xs);color:var(--mute);line-height:1.5}
@media (min-width:900px){.foot{padding-bottom:32px}}

/* ===== общие блоки ===== */
.col{display:flex;flex-direction:column;gap:var(--sp6);min-width:0}
.sec{display:flex;flex-direction:column;gap:var(--sp3);min-width:0}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp3);flex-wrap:wrap}
.hd h1,.hd h2{font-family:var(--f-disp);font-weight:700;font-size:calc(var(--fs-2xl)*var(--disp-k));line-height:1.05}
.hd h3{font-family:var(--f-disp);font-weight:700;font-size:calc(var(--fs-xl)*var(--disp-k));line-height:1.1}
.hd small{display:inline-block;font-family:var(--f-body);font-size:var(--fs-s);font-weight:500;color:var(--mute);margin-left:var(--sp2)}
.hd .lnk,.lnk{font-size:var(--fs-s);font-weight:600;color:var(--link)}
@media (max-width:640px){.hd h1,.hd h2{font-size:calc(30px*var(--disp-k))}.hd small{display:block;margin:4px 0 0}}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pad{padding:var(--sp4)}
.note{font-size:var(--fs-xs);color:var(--mute);line-height:1.5}
.txt{font-size:var(--fs-s);color:var(--ink2);line-height:1.55}
.txt b{color:var(--ink)}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;font-size:var(--fs-s);font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2)}
.pills button[aria-pressed="true"],.pills button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:700;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.chip.gold{background:var(--goldbg);color:var(--gold)}
.chip.win{background:var(--winbg);color:var(--win)}
.chip.loss{background:var(--lossbg);color:var(--loss)}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-s);font-weight:600;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn svg{width:16px;height:16px;fill:currentColor}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:var(--sp5) var(--sp4);color:var(--mute);font-size:var(--fs-s);text-align:center}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r2);background:var(--goldbg);color:var(--ink2);font-size:var(--fs-s)}
.ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.ul li{font-size:var(--fs-s);line-height:1.5;color:var(--ink2);padding-left:14px;position:relative}
.ul li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--mute)}
.ul li b{color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.kv>div{display:flex;flex-direction:column;gap:2px}
.kv small{font-size:var(--fs-xs);color:var(--mute);font-weight:600}
.kv b{font-family:var(--f-disp);font-size:22px;line-height:1.1}
h4.sub{font-size:var(--fs-xs);font-weight:700;color:var(--mute);letter-spacing:.01em;margin:0}

/* логотипы и фото */
.lg{--s:28px;width:var(--s);height:var(--s);flex:none;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.lg img,.lg picture{width:100%;height:100%;object-fit:contain;display:block}
.lg svg{width:100%;height:100%}
.ph{--s:44px;--c:#556;width:var(--s);height:var(--s);flex:none;border-radius:50%;overflow:hidden;background:var(--c);position:relative;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-disp);font-weight:800;font-size:calc(var(--s)*.38)}
.ph img{width:132%;height:132%;max-width:none;object-fit:cover;object-position:50% 0;position:absolute;left:-16%;top:-3%;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0))}
.ph:has(img) .ph-t{visibility:hidden}
.ph.ring{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--c)}
.plink{font-weight:700;color:inherit;text-align:left}
.plink:hover{color:var(--link)}

/* форма */
.fd{display:inline-flex;gap:3px;flex:none}
.fd i{font-style:normal;width:17px;height:17px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;background:var(--mute)}
.fd i.W{background:var(--win)}.fd i.L{background:var(--loss)}.fd i.O{background:var(--ot)}

/* полоски */
.bar2{height:5px;border-radius:3px;background:var(--soft2);overflow:hidden;flex:1;display:block}
.bar2 i{display:block;height:100%;border-radius:3px;background:var(--c,var(--ink));width:var(--w);animation:grow .6s ease-out both}
@keyframes grow{from{width:0}}
.sbar{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:var(--fs-s)}
.sbar>b{font-family:var(--f-disp);font-size:18px}
.sbar>b:last-child{text-align:right}
.sbar .mid{display:flex;flex-direction:column;gap:4px;align-items:center}
.sbar .mid small{font-size:var(--fs-xs);color:var(--mute);font-weight:600}
.sbar .two{display:flex;width:100%;gap:3px;height:6px}
.sbar .two i{display:block;height:100%;border-radius:3px;animation:grow .6s ease-out both}
.sbars{display:flex;flex-direction:column;gap:12px}

/* живое */
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;flex:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(215,38,47,.55)}50%{box-shadow:0 0 0 6px rgba(215,38,47,0)}}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--fc,rgba(215,38,47,.35))}100%{background:transparent}}
.tick{display:inline-block;animation:tick .5s ease-out}
@keyframes tick{0%{transform:translateY(-60%);opacity:0}100%{transform:none;opacity:1}}
.appear{animation:appear .25s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(-4px)}}
.skel{display:flex;flex-direction:column;gap:12px}
.skel i{display:block;height:64px;border-radius:var(--r);background:linear-gradient(90deg,var(--soft2),var(--soft),var(--soft2));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== строки матчей ===== */
.mr{border-top:1px solid var(--line);position:relative}
.mr:first-child{border-top:0}
.mr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--ca) 0 50%,var(--ch) 50% 100%);opacity:.9}
.mr.mo::before{background:var(--gold);width:4px}
.row{display:grid;grid-template-columns:72px minmax(0,1fr) 120px 220px 20px;gap:6px 16px;align-items:center;padding:14px 16px 14px 18px;width:100%}
.row:hover{background:var(--soft)}
.t{display:flex;flex-direction:column;font-family:var(--f-disp);font-size:20px;font-weight:700;line-height:1}
.t small{font-family:var(--f-body);font-size:var(--fs-xs);font-weight:600;color:var(--mute);margin-top:5px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.t small.live{color:var(--red)}
.t.lv{font-size:17px;white-space:nowrap}
.tms{display:flex;flex-direction:column;gap:8px;min-width:0}
.tm{display:flex;align-items:center;gap:10px;min-width:0}
.tm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .rec{color:var(--mute);font-size:var(--fs-xs);font-variant-numeric:tabular-nums;white-space:nowrap}
.tm .fd{margin-left:auto}
.tm .sc{margin-left:auto;font-family:var(--f-disp);font-size:24px;font-weight:700;line-height:1;min-width:26px;text-align:right}
.tm.lo b,.tm.lo .sc{color:var(--mute)}
.tm .p{margin-left:auto;font-weight:600;color:var(--mute);font-size:var(--fs-s)}
.tm .p.f{color:var(--ink);font-weight:800}
.pcs{display:flex;flex-direction:column;gap:8px}
.pcs span{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--mute);font-size:var(--fs-s)}
.pcs span.f{color:var(--ink);font-weight:800}
.pcs .bar2 i{background:var(--soft2)}
.pcs span.f .bar2 i{background:var(--c)}
.pk{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.pk .k{font-size:var(--fs-s);font-weight:600;white-space:nowrap}
.pk .k small{color:var(--mute);font-weight:500;margin-right:4px;font-size:var(--fs-xs)}
.chev{width:20px;height:20px;fill:none;stroke:var(--mute);stroke-width:2;transition:transform .2s}
.row[aria-expanded="true"] .chev{transform:rotate(180deg)}
.mo-t{grid-column:2/-1;font-size:var(--fs-s);line-height:1.5;color:var(--ink2)}
.mo-t b{color:var(--gold)}
@media (max-width:760px){
  .row{grid-template-columns:58px minmax(0,1fr) 20px;padding:12px 12px 12px 14px}
  .pcs{display:none}
  .pk{grid-column:2/3;flex-direction:row;flex-wrap:wrap;gap:6px 12px;align-items:center}
  .chev{grid-column:3;grid-row:1}
  .tm .fd,.tm .rec{display:none}
  .mo-t{grid-column:1/-1}
}
@media (min-width:761px){.tm .p{display:none}}
.x{padding:4px 16px 18px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 28px;border-top:1px dashed var(--line);animation:appear .25s ease-out}
.x>.full{grid-column:1/-1}
.blk{display:flex;flex-direction:column;gap:8px;min-width:0}
.blk h4{margin:12px 0 0;font-size:var(--fs-xs);font-weight:700;color:var(--mute)}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.picks>div{background:var(--soft);border-radius:var(--r2);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.picks small{font-size:var(--fs-xs);font-weight:700;color:var(--mute)}
.picks b{font-family:var(--f-disp);font-size:calc(24px*var(--disp-k));line-height:1.1}
.picks b em{font-style:normal;font-family:var(--f-body);font-size:var(--fs-s);color:var(--mute);font-weight:600;margin-left:6px}
.picks p{font-size:var(--fs-s);line-height:1.45;color:var(--ink2)}
.alt{background:var(--goldbg);border-radius:var(--r2);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.alt small{font-size:var(--fs-xs);font-weight:700;color:var(--gold)}
.alt p{font-size:var(--fs-s);line-height:1.5;color:var(--ink2)}
.alt b{color:var(--ink)}
.more{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px}
.more>summary{cursor:pointer;font-weight:700;font-size:var(--fs-s);color:var(--link);list-style:none}
.more>summary::-webkit-details-marker{display:none}
.more[open]>summary{margin-bottom:12px}
.more .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 28px}
.ess{display:flex;flex-direction:column;gap:10px}
.ess p{font-size:var(--fs-s);line-height:1.6;color:var(--ink2);max-width:72ch}
@media (max-width:760px){.x,.more .in{grid-template-columns:minmax(0,1fr);padding-left:14px;padding-right:12px}.more .in{padding:0}.picks{grid-template-columns:minmax(0,1fr)}}
table.mt{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
table.mt th{font-size:var(--fs-xs);color:var(--mute);font-weight:700;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
table.mt td{padding:8px;text-align:right;border-top:1px solid var(--line)}
table.mt th:first-child,table.mt td:first-child{text-align:left}
table.mt td small{display:block;color:var(--mute);font-size:var(--fs-xs)}
.goals{display:flex;flex-direction:column;gap:6px}
.goals .per{font-size:var(--fs-xs);font-weight:700;color:var(--mute);margin-top:6px}
.goal{display:grid;grid-template-columns:44px 22px minmax(0,1fr);gap:8px;align-items:center;font-size:var(--fs-s)}
.goal time{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:600}
.goal em{font-style:normal;font-size:var(--fs-xs);font-weight:700;color:var(--gold);margin-left:6px}
.goal .as{color:var(--mute)}
.wk{display:grid;grid-template-columns:72px minmax(0,240px) minmax(0,240px);gap:10px 16px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.wk:first-child{border-top:0}
.day>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:8px;font-family:var(--f-disp);font-weight:700;font-size:calc(20px*var(--disp-k));margin-bottom:8px}
.day>summary::-webkit-details-marker{display:none}

.lines{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-s)}
.lines>div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.lines .k{font-weight:700;color:var(--mute);width:38px;flex:none;font-size:var(--fs-xs)}
.spark{display:flex;align-items:flex-end;gap:3px;height:56px}
.spark i{flex:1;min-width:4px;max-width:18px;background:var(--c,var(--blue));border-radius:3px 3px 0 0;animation:growh .5s ease-out both}
.spark i.z{background:var(--soft2);height:4px!important}
@keyframes growh{from{height:0}}
/* читалка */
.reader .cover{aspect-ratio:16/8;max-height:360px}
.reader .rb{padding:18px 20px 30px;display:flex;flex-direction:column;gap:14px}
.reader h1{font-family:var(--f-disp);font-size:calc(32px*var(--disp-k));line-height:1.08}
.reader .dek{font-size:var(--fs-l);line-height:1.45;color:var(--ink2)}
.reader .body p{font-size:17px;line-height:1.65;margin:0 0 14px;max-width:68ch}
.reader .who{display:flex;gap:10px;flex-wrap:wrap}
.reader .who button{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:var(--fs-s)}
.reader .who .ph{--s:30px}
.reader .who .lg{--s:26px}
</style>

name: Пульс канала

# Расписание GitHub (cron) срабатывает нерегулярно: 16.10 из ~13 запусков канала по расписанию прошёл один.
# Этот «пульс» сам будит канал: каждые 10 минут с 09:00 до 01:00 по Москве запускает «Telegram-канал» (режим auto),
# работает до 5 ч 50 мин и перед окончанием запускает сам себя заново — цепочка не рвётся.
# Старт цепочки — изменением trigger/tick или вручную; резерв — раз в час по расписанию.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["trigger/tick"]
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Пульс
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          start=$(date +%s)
          while [ $(( $(date +%s) - start )) -lt 20700 ]; do
            h=$(TZ=Europe/Moscow date +%H)
            if [ "$h" -ge 9 ] || [ "$h" -lt 1 ]; then
              gh workflow run tg.yml -R "$REPO" -f mode=auto && echo "$(date -u +%H:%M) канал разбужен" || echo "$(date -u +%H:%M) не вышло разбудить"
            fi
            sleep 600
          done
          gh workflow run tick.yml -R "$REPO" && echo "цепочка продолжена"

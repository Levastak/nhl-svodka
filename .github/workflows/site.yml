name: Сводка НХЛ

on:
  schedule:
    - cron: "52 5 * * *"    # 08:52 по Кирову — утренний сбор (последние матчи заканчиваются около 08:45) okkk
    - cron: "19 20 * * *"   # 23:19 по Кирову — предматчевый сбор
    - cron: "41 7 * * 1"     # понедельник 10:41 по Кирову — истории клубов и карьеры игроков
    - cron: "8 7 * * *"     # 10:08 по Кирову — запасные тексты, если утренние тексты Claude не вышли
    - cron: "40 22 * * *"   # 01:40 по Кирову — запуск ночного дозора
    - cron: "10 4 * * *"    # 07:10 по Кирову — второй дозор до последних матчей
    - cron: "*/15 0-6 * * *"    # ночь по Кирову (03:00–09:59): закончился матч — сразу итоги, таблица, лидеры
    - cron: "*/15 16-23 * * *"  # дневные матчи выходных (19:00–02:59 по Кирову)
  workflow_dispatch:
    inputs:
      mode:
        description: "am — утренний сбор, pm — предматчевый, deploy — только опубликовать"
        default: deploy
  push:
    branches: [main]
    paths: ["site/**", "trigger/**"]

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: svodka
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Режим
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in "52 5 * * *") M=am;; "19 20 * * *") M=pm;; "41 7 * * 1") M=weekly;; "8 7 * * *") M=auto;; "40 22 * * *"|"10 4 * * *") M=watch;; *) M=night;; esac
            # trigger/skip: «дата режим» — пропустить один плановый сбор (например «2026-10-12 pm»)
            if grep -qx "$(date -u +%F) $M" trigger/skip 2>/dev/null; then M=deploy; fi
            echo "mode=$M" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD | grep -q '^trigger/hist$'; then
            echo "mode=hist" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD | grep -q '^trigger/mode$'; then
            echo "mode=$(head -n1 trigger/mode | tr -d '[:space:]')" >> $GITHUB_OUTPUT
          else
            echo "mode=deploy" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ночной дозор
        if: steps.mode.outputs.mode == 'watch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml
      - name: Сбор данных и модель
        if: steps.mode.outputs.mode != 'deploy' && steps.mode.outputs.mode != 'watch'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch.py ${{ steps.mode.outputs.mode }}
      - name: Фото к новостям
        if: steps.mode.outputs.mode == 'deploy'
        run: python3 scripts/fetch.py img || true
      - name: Сохранить данные в репозиторий
        id: save
        run: |
          git config user.name "svodka-bot"
          git config user.email "svodka-bot@users.noreply.github.com"
          git add site; [ -d history ] && git add history || true
          git diff --cached --quiet && exit 0
          git commit -m "Данные: ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
          echo "changed=1" >> $GITHUB_OUTPUT
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
      - name: Версия скриптов
        if: (steps.mode.outputs.mode != 'night' && steps.mode.outputs.mode != 'watch') || steps.save.outputs.changed == '1'
        run: echo "${{ github.run_id }}" > site/version.txt
      - uses: actions/configure-pages@v5
        if: (steps.mode.outputs.mode != 'night' && steps.mode.outputs.mode != 'watch') || steps.save.outputs.changed == '1'
      - uses: actions/upload-pages-artifact@v3
        if: (steps.mode.outputs.mode != 'night' && steps.mode.outputs.mode != 'watch') || steps.save.outputs.changed == '1'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: (steps.mode.outputs.mode != 'night' && steps.mode.outputs.mode != 'watch') || steps.save.outputs.changed == '1'
        id: deploy
